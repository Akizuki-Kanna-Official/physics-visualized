<div class="tab on" id="t-sol"><div class="pager" id="pg-sol"><p class="q">质量为 <span class="f">M</span> 的木块放在光滑水平面上，质量为 <span class="f">m</span> 的子弹以初速度 <span class="f">v</span>₀ 水平打进木块并留在其中，子弹所受阻力为 <span class="f">f</span>。求：(1) 相对静止时的速度；(2) 子弹在木块内运动的时间；(3) 子弹、木块的位移及打入深度；(4) 要使子弹不射出，木块至少多长。</p>
<p class="fnote"><span class="f">f</span> 是木块对子弹的恒定阻力，木块受到其反作用力（大小也为 <span class="f">f</span>）；地面光滑。</p><h3>解答</h3><div id="ans"></div></div><div class="pgnav"></div></div>

const KEY="q1";
function exactSolve(m,M,v0,f,L){const mM=qa(m,M),v=qd(qm(m,v0),mM),t=qd(qm(qm(m,M),v0),qm(f,mM)),two=R(2),
s1=qd(qm(m,qs(qm(v0,v0),qm(v,v))),qm(two,f)),s2=qd(qm(M,qm(v,v)),qm(two,f)),d=qs(s1,s2),Q=qm(f,d),E0=qm(R(1,2),qm(m,qm(v0,v0))),
Eb=qm(R(1,2),qm(m,qm(v,v))),Ek=qm(R(1,2),qm(M,qm(v,v)));
const r={v,t,tms:qm(t,R(1000)),s1,s2,d,Q,E0,Eb,Ek,rQ:qd(Q,E0),rB:qd(Eb,E0),rK:qd(Ek,E0),thru:qv(d)>qv(L)};
if(r.thru){const a=qm(f,qa(qd(R(1),m),qd(R(1),M))),disc=qs(qm(v0,v0),qm(qm(two,a),L)),sq=qsqrt(disc);
const te={r:qd(v0,a),k:qd(R(-sq.k.n,sq.k.d),a),n:sq.n},fm=qd(f,m),fM=qd(f,M);
r.te=te;r.teMs={r:qm(te.r,R(1000)),k:qm(te.k,R(1000)),n:te.n};r.vb={r:qs(v0,qm(fm,te.r)),k:R(-1n*qm(fm,te.k).n,qm(fm,te.k).d),n:te.n};r.vk={r:qm(fM,te.r),k:qm(fM,te.k),n:te.n};}
return r;}
const C={clay:"#C96442",ink:"#1F1E1D",muted:"#7A776D",line:"#E3E0D5",wood:"#B98A5E",wood2:"#9C7048",sage:"#6F7F63",brass:"#C9A24A"};
const defs=[["m","子弹质量 m","kg",0.005,0.2,0.005,0.02],["M","木块质量 M","kg",0.2,5,0.1,1],["v0","初速度 v₀","m/s",50,600,10,300],["f","子弹所受阻力 f","N",500,20000,100,4000],["L","木块长度","m",0.05,0.5,0.01,0.3]];

function solve(){const{m,M,v0,f,L}=P,v=m*v0/(m+M),t=m*M*v0/(f*(m+M)),s1=m*(v0*v0-v*v)/(2*f),s2=M*v*v/(2*f),d=s1-s2,E0=.5*m*v0*v0,Q=f*d;S={v,t,s1,s2,d,Q,E0};

X=exactSolve(PX.m,PX.M,PX.v0,PX.f,PX.L);const V=(q,u)=>`<span class="v">${exH(q,u)}</span>`,i=t=>`<span class="f">${t}</span>`;
$("ans").innerHTML=

st(2,`对木块用动量定理：${i("ft")} = ${i("Mv")}（${i("f")} 为子弹所受阻力，木块受其反作用力），得 ${i("t")} = ${V(X.tms,"ms")}`)+
st(3,`动能定理。子弹：${i("fs")}₁ = ½${i("m")}(${i("v")}₀²−${i("v")}²)，${i("s")}₁ = ${V(X.s1,"m")}；木块：${i("fs")}₂ = ½${i("Mv")}²，${i("s")}₂ = ${V(X.s2,"m")}<br>打入深度 ${i("d")} = ${i("s")}₁−${i("s")}₂ = ${i("mMv")}₀² / [2${i("f")}(${i("m")}+${i("M")})] = ${V(X.d,"m")}`)+
st(4,`不射出需木块长 ${i("L")} ≥ ${V(X.d,"m")}。损失的机械能 ${i("Q")} = ${i("fd")} = ${V(X.Q,"J")}，占初动能 ${exH(X.rQ)} ≈ ${fx(qv(X.rQ)*100,1)}%`)+
(X.thru?`<div class="note bad">当前木块长 ${i("L")} = ${exH(PX.L,"m")} 小于 ${i("d")}，子弹会射穿木块，上面 (1)～(4) 的共速结论不再成立。射出时刻 ${i("t")} = ${surdH(X.teMs,"ms")}，子弹 ${i("v")}₁ = ${surdH(X.vb,"m/s")}，木块 ${i("v")}₂ = ${surdH(X.vk,"m/s")}</div>`:`<div class="note ok">当前木块长 ${i("L")} = ${exH(PX.L,"m")} ≥ ${i("d")}，子弹留在木块内，与木块共速。</div>`);}
function reset(){read();solve();K=620/Math.max(P.L+S.s2*1.4+0.12,0.45);st={xb:-110/K,vb:P.v0,xk:0,vk:0,t:0,inside:false,out:false,pen:0,trail:[]};run=false;if(typeof updBtns==="function")updBtns();}
function step(dt){const{m,M,f,L}=P,n=300,h=dt/n;
for(let i=0;i<n;i++){const front=st.xk,back=st.xk+L,inB=st.xb>=front&&st.xb<=back&&!st.out;
if(inB&&st.vb>st.vk+1e-9){st.inside=true;st.vb-=f/m*h;st.vk+=f/M*h;if(st.vb<st.vk){const v=(m*st.vb+M*st.vk)/(m+M);st.vb=st.vk=v;}}
else if(inB&&st.inside)st.vb=st.vk;
st.xb+=st.vb*h;st.xk+=st.vk*h;st.t+=h;if(st.inside&&st.xb>back)st.out=true;if(st.inside&&!st.out)st.pen=st.xb-front;}}

// ===== 放大镜区域 =====
function niceR(v){const c=[0.5,1,2,3,5,8,10,15,20,30,50,80,100,150,200,300,500];for(const x of c)if(x>=v)return x;return Math.ceil(v/100)*100;}
function drawInset(){const top=300,bot=CH-16,L0=40,R0=640;
ctx.fillStyle="#F6F3EC";rr(24,top-8,CW-48,bot-top+16,14);ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();
// 先缩放后平移：u=xk·ppm0/432，木块左缘 E=sx0+432·tanh u（平滑趋于固定位置），倍率 ppm=ppmMin+(ppm0−ppmMin)·tanh(u)/u 平滑趋于冻结值，平移量 pan=xk−(E−sx0)/ppm ≥ 0
const sx0=L0+30,gyI=bot-34,ppm0=(R0-L0-60)/niceR(Math.max(S.s2*1000*1.35,0.3)),ppmMin=ppm0/4,xkm=Math.max(st.xk*1000,0),{ppm,exE,pan}=magZoom(xkm,ppm0,ppmMin,sx0,432),Rmm=(R0-L0-60)/ppm,W2S=mm=>sx0+(mm-pan)*ppm;

ctx.fillStyle=C.muted;ctx.font="12px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText((pan>0?"放大镜 · 跟随木块左缘":"放大镜 · 起点附近")+"（约 ×"+(ppm/(K/1000)).toFixed(0)+"）",L0,top+14);
ctx.fillStyle=C.muted;ctx.font="12px 'Source Serif 4','Noto Serif SC',serif";
ctx.save();ctx.beginPath();ctx.rect(L0,top+22,R0-L0,bot-top-22);ctx.clip();
// 木块左端
const ex=W2S(xkm),bt=top+44;st._ins={ppm,ex,pan};
const g=ctx.createLinearGradient(0,bt,0,gyI);g.addColorStop(0,"#C99B6E");g.addColorStop(1,"#A87A50");ctx.fillStyle=g;rr(ex,bt,R0-ex+20,gyI-bt,6);ctx.fill();
ctx.strokeStyle="rgba(255,255,255,.14)";for(let y=bt+10;y<gyI;y+=11){ctx.beginPath();ctx.moveTo(ex,y);ctx.lineTo(R0+20,y+2);ctx.stroke();}
// 子弹（按放大镜比例；主场景 24px 长 → 24/K 米）与逐渐延伸的弹孔
const zoom=ppm*1000/K,hyI=(bt+gyI)/2,bl=24/K*1000*ppm,bhh=Math.min(5*zoom,(gyI-bt)*.18),tip=W2S(st.xb*1000),tail=tip-bl,back=ex+P.L*1000*ppm;
if(st.inside){const hEnd=st.out?back:Math.min(tip,back);if(hEnd>ex){ctx.fillStyle="rgba(60,35,15,.55)";ctx.fillRect(ex,hyI-bhh,Math.min(hEnd,R0+20)-ex,bhh*2);}}
if(tip>L0&&tail<R0){const nl=Math.min(bl*14/24,bhh*2.8);ctx.fillStyle=C.brass;ctx.beginPath();ctx.moveTo(tip,hyI);ctx.quadraticCurveTo(tip-nl*.43,hyI-bhh,tip-nl,hyI-bhh);ctx.lineTo(tail,hyI-bhh);ctx.lineTo(tail,hyI+bhh);ctx.lineTo(tip-nl,hyI+bhh);ctx.quadraticCurveTo(tip-nl*.43,hyI+bhh,tip,hyI);ctx.fill();
ctx.fillStyle="#A8842F";ctx.fillRect(tail,hyI-bhh,Math.max(2,bl*3/24),bhh*2);}
ctx.restore();
if(tip>R0){const ay=hyI;ctx.fillStyle="rgba(252,251,248,.92)";rr(R0-54,ay-12,60,24,8);ctx.fill();ctx.strokeStyle="rgba(201,100,66,.25)";ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle=C.clay;ctx.fillStyle=C.clay;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(R0-46,ay);ctx.lineTo(R0-4,ay);ctx.stroke();ctx.beginPath();ctx.moveTo(R0+2,ay);ctx.lineTo(R0-10,ay-7);ctx.lineTo(R0-10,ay+7);ctx.fill();
const fin=st.inside&&!st.out&&st.vb<=st.vk+1e-6,pmm=fx(Math.min(st.pen,P.L)*1000,1);
const seg=st.out?[["子弹 → 已射穿木块（",0],["L",1],[" = "+fx(P.L*1000,1)+" mm）",0]]:fin&&!X.thru?[["子弹 → 深度 ",0],["d",1],[" = ",0],["",0,X.d],[" m = "+pmm+" mm",0]]:[["子弹 → 深度 ",0],["d",1],[" = "+pmm+" mm",0]];

const lw=(()=>{ctx.save();ctx.globalAlpha=0;const r=rich(ctx,seg,0,-999,12.5,"left");ctx.restore();return r;})();
ctx.fillStyle="rgba(252,251,248,.9)";rr(R0-56-lw-10,ay-bhh-34,lw+16,26,6);ctx.fill();ctx.strokeStyle="rgba(201,100,66,.25)";ctx.lineWidth=1;ctx.stroke();rich(ctx,seg,R0-56-lw-2,ay-bhh-16,12.5,"left","#9E4429");}
// 地面+刻度
ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(L0,gyI);ctx.lineTo(R0,gyI);ctx.stroke();
const stepMM=niceStep(Rmm,8),hiMM=pan+(R0-sx0)/ppm,useM=hiMM>=1000,dec=useM?Math.max(0,Math.ceil(-Math.log10(stepMM/1000)-1e-9)):Math.max(0,Math.ceil(-Math.log10(stepMM)-1e-9));
ctx.lineWidth=1;ctx.fillStyle=C.muted;ctx.textAlign="center";ctx.font="11px 'Source Serif 4',Georgia,serif";
for(let v=Math.max(0,Math.ceil((pan-(sx0-L0)/ppm)/stepMM))*stepMM;v<=hiMM+1e-9;v+=stepMM){const x=W2S(v);if(x<L0-1)continue;ctx.strokeStyle=C.muted;ctx.beginPath();ctx.moveTo(x,gyI);ctx.lineTo(x,gyI+9);ctx.stroke();if(x<R0-34&&x>L0+8)ctx.fillText((useM?v/1000:v).toFixed(dec),x,gyI+21);}
ctx.textAlign="left";ctx.fillText(useM?"m":"mm",R0-24,gyI+21);
// 起点线（随平移移出左侧后显示“← 起点”）
const sxS=W2S(0);if(sxS>=L0){ctx.setLineDash([4,4]);ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(sxS,top+30);ctx.lineTo(sxS,gyI);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle=C.ink;ctx.font="11px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText("起点",sxS-12,top+32);}
else{ctx.fillStyle=C.ink;ctx.font="11px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText("← 起点",L0,top+32);}
// s2 箭头
if(st.xk>0){const ay=top+36,a0=Math.max(sxS,L0+42);if(ex>a0){ctx.strokeStyle=C.clay;ctx.fillStyle=C.clay;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a0,ay);ctx.lineTo(ex,ay);ctx.stroke();if(ex-a0>8){ctx.beginPath();ctx.moveTo(ex,ay);ctx.lineTo(ex-8,ay-5);ctx.lineTo(ex-8,ay+5);ctx.fill();}}}
// 右侧大读数
const rx=R0+40;ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(R0+16,top+10);ctx.lineTo(R0+16,bot-10);ctx.stroke();
ctx.fillStyle=C.muted;ctx.font="13px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText("木块位移 s₂",rx,top+28);ctx.fillText("打入深度 d（子弹相对木块）",rx,top+102);
ctx.fillStyle=C.clay;ctx.font="600 38px 'Source Serif 4',Georgia,serif";ctx.fillText(st.xk>=1?fx(st.xk,3)+" m":fx(st.xk*1000,2)+" mm",rx,top+72);
ctx.fillStyle=C.ink;ctx.fillText(fx(Math.min(st.pen,P.L)*1000,1)+" mm",rx,top+146);
}
function draw(){ctx.clearRect(0,0,CW,CH);const cam=st.camX||0,x0=230-cam,gy=250,bh=92;
drawGround({gy,cam,K,ox:230});
// 起点参考线
ctx.setLineDash([3,4]);ctx.strokeStyle="#D6D2C5";ctx.beginPath();ctx.moveTo(x0,gy-bh-30);ctx.lineTo(x0,gy);ctx.stroke();ctx.setLineDash([]);

const bx=x0+st.xk*K,bw=Math.max(P.L*K,10),by=gy-bh;
ctx.save();ctx.shadowColor="rgba(80,60,30,.18)";ctx.shadowBlur=14;ctx.shadowOffsetY=6;rr(bx,by,bw,bh,6);
const g=ctx.createLinearGradient(0,by,0,gy);g.addColorStop(0,"#C99B6E");g.addColorStop(1,"#A87A50");ctx.fillStyle=g;ctx.fill();ctx.restore();
ctx.save();rr(bx,by,bw,bh,6);ctx.clip();ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;for(let y=by+10;y<gy;y+=11){ctx.beginPath();ctx.moveTo(bx,y);ctx.bezierCurveTo(bx+bw*.3,y-3,bx+bw*.7,y+3,bx+bw,y);ctx.stroke();}
const hy=by+bh/2;if(st.inside){ctx.fillStyle="rgba(60,35,15,.55)";ctx.fillRect(bx,hy-2.5,Math.min(st.pen,P.L)*K,5);}ctx.restore();
ctx.fillStyle="rgba(255,255,255,.92)";ctx.font="600 15px 'Source Serif 4',Georgia,serif";ctx.textAlign="center";ctx.fillText("M",bx+bw/2,by+22);ctx.textAlign="left";
// 子弹（拖尾）
st.trail.push(st.xb);if(st.trail.length>14)st.trail.shift();const px=x0+st.xb*K;
if(!(st.inside&&!st.out&&st.vb<=st.vk+1e-6)||st.out){const tl=x0+st.trail[0]*K;const gr=ctx.createLinearGradient(tl,0,px,0);gr.addColorStop(0,"rgba(201,100,66,0)");gr.addColorStop(1,"rgba(201,100,66,.35)");ctx.fillStyle=gr;ctx.fillRect(tl,hy-2,px-tl-12,4);}
ctx.fillStyle=C.brass;ctx.beginPath();ctx.moveTo(px+4,hy);ctx.quadraticCurveTo(px-2,hy-5,px-10,hy-5);ctx.lineTo(px-20,hy-5);ctx.lineTo(px-20,hy+5);ctx.lineTo(px-10,hy+5);ctx.quadraticCurveTo(px-2,hy+5,px+4,hy);ctx.fill();
ctx.fillStyle="#A8842F";ctx.fillRect(px-20,hy-5,3,10);
// 位移标注
const ay=gy-bh-22;ctx.strokeStyle=C.clay;ctx.fillStyle=C.clay;ctx.lineWidth=1.5;
const a0=Math.max(x0,44+(x0<44?54:0));if(st.xk*K>2&&bx>a0){ctx.beginPath();ctx.moveTo(a0,ay);ctx.lineTo(bx,ay);ctx.stroke();ctx.beginPath();ctx.moveTo(bx,ay);ctx.lineTo(bx-6,ay-4);ctx.lineTo(bx-6,ay+4);ctx.fill();}
ctx.font="12.5px 'Source Serif 4','Noto Serif SC',serif";if(x0<44)ctx.fillText("← 起点",44,ay+4);ctx.fillText("木块位移 s₂ = "+fx(st.xk,4)+" m",a0+4,ay-8);
drawInset();drawGraphs();drawPie();
// 左上角仪表
ctx.fillStyle=C.muted;ctx.font="12px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText("时间",44,40);
ctx.fillStyle=C.ink;ctx.font="600 20px 'Source Serif 4',Georgia,serif";ctx.fillText(fx(st.t*1000)+" ms",44,64);
const bars=[["子弹速度",st.vb,C.brass],["木块速度",st.vk,C.wood2]];
bars.forEach((b,i)=>{const y=40+i*30,x=640;ctx.fillStyle=C.muted;ctx.font="12px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText(b[0],x,y+4);
ctx.fillStyle="#EFECE3";rr(x+64,y-4,230,8,4);ctx.fill();ctx.fillStyle=b[2];rr(x+64,y-4,Math.max(4,b[1]/P.v0*230),8,4);ctx.fill();
ctx.fillStyle=C.ink;ctx.font="600 13px 'Source Serif 4',Georgia,serif";ctx.fillText(fx(b[1],2)+" m/s",x+304,y+5);});
// 状态
let s=!st.inside?"子弹飞向木块":st.out?"子弹已射穿木块":st.vb>st.vk+1e-6?"子弹在木块中减速，木块加速":"共速，一起匀速运动";
ctx.fillStyle=C.clay;ctx.font="600 13px 'Source Serif 4','Noto Serif SC',serif";ctx.fillText("● "+s,44,92);
// 实时
const{m,M}=P,p=m*st.vb+M*st.vk,Ek=.5*m*st.vb*st.vb+.5*M*st.vk*st.vk,Q=S.E0-Ek;

const tsOff=()=>(110/K)/P.v0;
function chipUpd(){const ts=slow?(st.ts||((110/K)/P.v0/0.9)):tsOff(),N=1/ts,Nr=N>=100?Math.round(N/10)*10:Math.round(N);
const h=slow?`子弹时间：接触过程已放慢约 <b>${Nr}</b> 倍；退出慢放时画面速度的变化由播放倍率造成，不是物理过程 · 当前播放 <b>×1/${Nr}</b>`:`真实比例播放：屏幕速度与物理速度严格成正比（<b>×1/${Nr}</b>）`;
if(h!==chipLast){const e=$("hint");e.innerHTML=h;e.classList.toggle("off",!slow);chipLast=h;}}
function frame(t){if(lastT==null)lastT=t;const dt=Math.min((t-lastT)/1000,.05);lastT=t;
if(run){const contact=st.inside&&!st.out&&st.vb>st.vk+1e-6;
// 播放时间尺度：各阶段目标值不变，但实际尺度 st.ts 在对数空间按指数缓动（τ=0.5 s 真实时间），屏幕速度不再跳变
const tsA=(110/K)/P.v0/(slow?0.9:0.3),tsC=S.t/(slow?2.4:0.6),tsP=(slow?110:260)/(K*Math.max(st.vk,1e-3));
const co=st.inside&&!st.out&&!contact;if(co)st.hold=(st.hold||0)+dt;
const tgt=(!st.inside||st.out)?tsA:contact?tsC:(st.hold<0.4?tsC:tsP);
if(!slow)st.ts=tsOff();else st.ts=tsEase(st.ts,tgt,dt,0.5);
const dS=dt*st.ts;step(dS);
// 镜头跟随：共速（或射穿）后，镜头速度占木块速度的比例 camA 按 τ=0.6 s 真实时间平滑升到 1，木块在屏幕上平滑停在固定位置
if(st.inside&&(st.out||!contact)){st.camA=(st.camA||0)+(1-(st.camA||0))*(1-Math.exp(-dt/0.6));st.camX=(st.camX||0)+st.camA*st.vk*K*dS;}}
draw();chipUpd();requestAnimationFrame(frame);}
function x0px(){return 230+(st.xk+P.L)*K;}
const PIE={c:$("pie"),x:$("pie").getContext("2d"),w:300,h:300};
function drawPie(){const{m,M}=P,E0=S.E0,tb=.5*m*st.vb*st.vb/E0,tk=.5*M*st.vk*st.vk/E0,tgt=[tb,tk,Math.max(0,1-tb-tk)];
const done=st.inside&&!st.out&&st.vb<=st.vk+1e-6&&!X.thru;pieRender(PIE,tgt,[C.brass,C.wood2,C.clay],["子弹剩余动能","木块动能","内能 <i class=f>Q</i>"],done,[X.rB,X.rK,X.rQ],st.t===0);}
const GV=mk("gv"),GX=mk("gx"),GE=mk("ge"),GMAP={gv:GV,gx:GX,ge:GE};
function kin(tau){const{m,M,v0,f}=P,ab=f/m,ak=f/M,tc=G.tc;const at=t=>({vb:v0-ab*t,vk:ak*t,xb:v0*t-ab*t*t/2,xk:ak*t*t/2});
if(tau<=0)return{vb:v0,vk:0,xb:v0*tau,xk:0};if(tau<=tc)return at(tau);const e=at(tc),u=tau-tc;return{vb:e.vb,vk:e.vk,xb:e.xb+e.vb*u,xk:e.xk+e.vk*u};}
let G={};
function gsetup(){const{m,M,v0,f,L}=P,a=f*(1/m+1/M);let tc=S.t,thru=false;
if(S.d>L){thru=true;tc=(v0-Math.sqrt(Math.max(v0*v0-2*a*L,0)))/a;}
G={tc,thru,T:tc*1.45,t0:(110/K)/v0,key:JSON.stringify(P)};}
function drawGraphs(){if(G.key!==JSON.stringify(P))gsetup();const{m,M,v0}=P,tc=G.tc,T=G.T,now=Math.min(Math.max(st.t-G.t0,0),T),tcN=Math.min(now,tc);
const vb=series(t=>kin(t).vb,now),vk=series(t=>kin(t).vk,now),z=series(()=>0,tcN),vbC=series(t=>kin(t).vb,tcN),vkC=series(t=>kin(t).vk,tcN);
// (a) v-t
let x=GV.x,A=frameAxes(GV,T,v0*1.08,[["速度 ",0],["v",1],[" / (m·s⁻¹)",0]],tc,v=>+v.toFixed(0)+"");
fillBetween(x,A,vkC,z,GC.s2);fillBetween(x,A,vbC,vkC,GC.d);hatch(x,A,vbC,z);

const lbl=G.thru?"射出":"共速";rich(x,[[lbl+"  ",0],["v",1],[" = ",0],["",0,G.thru?null:X.v],[G.thru?fx(e.vk,2):"",0],[" m/s，",0],["t",1],[" = ",0],["",0,G.thru?null:X.tms],[G.thru?fx(tc*1000,3):"",0],[" ms",0]],A.X(tc)+8,A.Y(e.vk)-16,12.5,"left","#9E4429");
if(G.thru)rich(x,[["子弹 ",0],["v",1],[" = "+fx(e.vb,1),0]],A.X(tc)+8,A.Y(e.vb)-6,12,"left","#7A776D");
// area label for d
rich(x,[["d",1]],A.X(tc*0.3),A.Y((v0*0.7+kin(tc*0.3).vk)/2)+5,15,"center","#9E4429");}
rich(x,[["v",1],["₀",0]],A.l+6,A.Y(v0)-6,12.5,"left","#7A776D");
const s1=e.xb,s2=e.xk;
legend(x,[{c:GC.b,line:1,t:[["子弹 ",0],["v",1],["₁",0]]},{c:GC.k,line:1,t:[["木块 ",0],["v",1],["₂",0]]},
{c:GC.d,t:[["两线之间 = 打入深度 ",0],["d",1],[" = ",0],["",0,X.thru?null:X.d],[X.thru?fx(s1-s2,4):"",0],[" m",0]]},
{c:"",hatch:1,t:[["子弹线下 = ",0],["s",1],["₁ = ",0],["",0,X.thru?null:X.s1],[X.thru?fx(s1,4):"",0],[" m",0]]},
{c:GC.s2,t:[["木块线下 = ",0],["s",1],["₂ = ",0],["",0,X.thru?null:X.s2],[X.thru?fx(s2,5):"",0],[" m",0]]}],A.r-250,A.t+26);
// (b) x-t  (mm)
x=GX.x;const xm=kin(T).xb*1000;A=frameAxes(GX,T,xm*1.08,[["位置 ",0],["x",1],[" / mm",0]],tc,v=>+v.toFixed(0)+"");
line(x,A,series(t=>kin(t).xb*1000,now),GC.b,2.2);line(x,A,series(t=>kin(t).xk*1000,now),GC.k,2.2);
if(now>=tc){const tt=now,pb=kin(tt).xb*1000,pk=kin(tt).xk*1000,XA=A.X(tt)-10;x.strokeStyle="#C96442";x.fillStyle="#C96442";x.lineWidth=1.3;
x.beginPath();x.moveTo(XA,A.Y(pk));x.lineTo(XA,A.Y(pb));x.stroke();[[pk,1],[pb,-1]].forEach(([p,s])=>{x.beginPath();x.moveTo(XA,A.Y(p));x.lineTo(XA-4,A.Y(p)-6*s);x.lineTo(XA+4,A.Y(p)-6*s);x.fill();});
rich(x,[["d",1],[" = ",0],["",0,X.thru?null:X.d],[X.thru?fx((pb-pk)/1000,4):"",0],[" m",0]],XA-8,(A.Y(pk)+A.Y(pb))/2,12.5,"right","#9E4429");
}
xtInset(x,A,now,tc,T);
legend(x,[{c:GC.b,line:1,t:[["子弹 ",0],["x",1],["₁",0]]},{c:GC.k,line:1,t:[["木块 ",0],["x",1],["₂",0]]}],A.l+12,A.t+16);
// (c) E-t (J)
x=GE.x;const E0=S.E0;A=frameAxes(GE,T,E0*1.12,[["能量 ",0],["E",1],[" / J",0]],tc,v=>+v.toFixed(0)+"");
const Eb=t=>.5*m*kin(t).vb**2,Ek=t=>.5*M*kin(t).vk**2;
line(x,A,series(()=>E0,T,2),GC.tot,1.4,[6,4]);
line(x,A,series(t=>E0-Eb(t)-Ek(t),now),GC.q,2.2);line(x,A,series(Eb,now),GC.b,2.2);line(x,A,series(Ek,now),GC.k,2.2);
legend(x,[{c:GC.tot,line:1,t:[["总能量 ",0],["E",1],["₀ = ",0],["",0,X.E0],[" J",0]]},{c:GC.b,line:1,t:[["子弹动能",0]]},{c:GC.k,line:1,t:[["木块动能",0]]},{c:GC.q,line:1,t:[["内能 ",0],["Q",1]]}],A.r-128,A.Y(E0*0.82));
}
// x–t 放大小图：共速后两段，同一比例尺，斜率三角形
function xtInset(x,A,now,tc,T){if(now<tc+1e-12||G.thru)return;const t1=Math.min(now,T),k=x._fz||1,ih=142*k,ix=A.X(T*.22),iw=A.X(T*.76)-ix,iy=Math.max(A.t+4,A.Y(kin(T).xb*1000*0.68));if(ih>(A.b-iy)-6||iw<200*k)return;
x.save();x.fillStyle="#FFFFFF";x.strokeStyle="rgba(31,30,29,.14)";x.lineWidth=1;rrx(x,ix,iy,iw,ih,8);x.fill();x.stroke();
rich(x,[["放大：共速后（两段纵轴同比例）",0]],ix+8*k,iy+15*k,11,"left","#7A776D");
const v=kin(tc).vk,span=Math.max(v*(T-tc)*1000,1e-6),sh=40*k,ppm=sh/(span*1.25),px0=ix+12*k,pw=iw-24*k,Xi=t=>px0+(t-tc)/(T-tc)*pw;
[["b",GC.b,"子弹"],["k",GC.k,"木块"]].forEach(([w,col,nm],j)=>{const y0=iy+24*k+j*(sh+12*k)+sh,base=kin(tc)["x"+w]*1000,Yi=xx=>y0-(xx-base)*ppm-sh*.1;
x.strokeStyle="rgba(31,30,29,.08)";x.beginPath();x.moveTo(px0,y0);x.lineTo(px0+pw,y0);x.stroke();
x.strokeStyle=col;x.lineWidth=2.2;x.beginPath();x.moveTo(Xi(tc),Yi(base));x.lineTo(Xi(t1),Yi(kin(t1)["x"+w]*1000));x.stroke();
// 斜率三角形
const ta=tc+(T-tc)*.15,tb2=tc+(T-tc)*.75;if(t1>=tb2){const ya=Yi(kin(ta)["x"+w]*1000),yb=Yi(kin(tb2)["x"+w]*1000);x.setLineDash([3,3]);x.strokeStyle="rgba(201,100,66,.8)";x.lineWidth=1;x.beginPath();x.moveTo(Xi(ta),ya);x.lineTo(Xi(tb2),ya);x.lineTo(Xi(tb2),yb);x.stroke();x.setLineDash([]);}
rich(x,[[nm,0]],px0+2,y0-sh+8*k,10.5,"left","#7A776D");});
if(t1>=tc+(T-tc)*.75)rich(x,[["两线斜率相同 ",0],["v",1],[" = ",0],["",0,X.v],[" m/s",0]],ix+iw/2,iy+ih-9*k,11.5,"center","#9E4429");x.restore();}
