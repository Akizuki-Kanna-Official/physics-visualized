<style>

</style></head><body><div class="wrap">
<span class="tag">模型一 · 子弹—木块</span>
<h1>第 1 题　子弹打木块</h1>
<p class="q">质量为 <span class="f">M</span> 的木块放在光滑水平面上，质量为 <span class="f">m</span> 的子弹以初速度 <span class="f">v</span>₀ 水平打进木块并留在其中，子弹与木块间相互作用力为 <span class="f">f</span>。求：(1) 相对静止时的速度；(2) 子弹在木块内运动的时间；(3) 子弹、木块的位移及打入深度；(4) 要使子弹不射出，木块至少多长。</p>
<div class="stage"><canvas id="c"></canvas><div id="clawd" class="clawd"></div>
<div class="bar"><button class="primary" id="play">▶ 播放</button><button id="slow">慢放 开</button><span class="hint">接触过程实际只有几毫秒，动画已按时间缩放</span></div></div>
<div class="params" id="params"></div>
<div class="cols">
<div class="box"><h3>解答</h3><div id="ans"></div><div id="note" class="note"></div></div>
<div class="box live"><h3>实时数据</h3><div id="live"></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const C={clay:"#C96442",ink:"#1F1E1D",muted:"#7A776D",line:"#E3E0D5",wood:"#B98A5E",wood2:"#9C7048",sage:"#6F7F63",brass:"#C9A24A"};
const defs=[["m","子弹质量 m","kg",0.005,0.2,0.005,0.02],["M","木块质量 M","kg",0.2,5,0.1,1],["v0","初速度 v₀","m/s",50,600,10,300],["f","作用力 f","N",500,20000,100,4000],["L","木块长度","m",0.05,0.5,0.01,0.3]];
$("params").innerHTML=defs.map(d=>`<div class="p"><div class="k">${d[1]}</div><div class="val"><span id="${d[0]}v"></span><small>${d[2]}</small></div><input id="${d[0]}" type="range" min="${d[3]}" max="${d[4]}" step="${d[5]}" value="${d[6]}"></div>`).join("");
const cv=$("c"),ctx=cv.getContext("2d"),CW=1040,CH=480,dpr=window.devicePixelRatio||1;
cv.width=CW*dpr;cv.height=CH*dpr;ctx.scale(dpr,dpr);
let P,S,st,run=false,slow=true,lastT=null,K;
const fx=(x,n=3)=>(+x).toFixed(n);
// 数值补间：滑块变化后 240ms 内从旧显示值缓动到新值（仅影响文字面板，不影响画布仿真）
const TW=240,easeTw=t=>1-Math.pow(1-t,3);
function mkTween(){return{t0:-1e9,from:{},last:{},v(k,x){const e=(performance.now()-this.t0)/TW;const y=(e<1&&k in this.from)?this.from[k]+(x-this.from[k])*easeTw(Math.max(0,e)):x;this.last[k]=y;return y;},kick(){this.dirty=true;this.from=Object.assign({},this.last);this.t0=performance.now();},active(){return performance.now()-this.t0<TW;}};}
const twA=mkTween(),twL=mkTween();let noteKind=null;
function read(){P={};defs.forEach(d=>{P[d[0]]=+$(d[0]).value;$(d[0]+"v").textContent=P[d[0]];});}
function solve(){const{m,M,v0,f,L}=P,v=m*v0/(m+M),t=m*M*v0/(f*(m+M)),s1=m*(v0*v0-v*v)/(2*f),s2=M*v*v/(2*f),d=s1-s2,E0=.5*m*v0*v0,Q=f*d;S={v,t,s1,s2,d,Q,E0};
renderAns();}
function renderAns(){const{L}=P,A=k=>twA.v(k,S[k]),v=A('v'),t=A('t'),s1=A('s1'),s2=A('s2'),d=A('d'),Q=A('Q'),E0=A('E0');
const st=(n,h)=>`<div class="step"><span class="n">${n}</span><div>${h}</div></div>`;
const kind=S.d>L?"bad":"ok";
$("ans").innerHTML=
st(1,`系统合外力为零，动量守恒：<span class="f">mv</span>₀ = (<span class="f">m</span>+<span class="f">M</span>)<span class="f">v</span>，得 <span class="v">v = ${fx(v)} m/s</span>`)+
st(2,`对木块用动量定理：<span class="f">ft</span> = <span class="f">Mv</span>，得 <span class="v">t = ${fx(t*1000)} ms</span>`)+
st(3,`动能定理。子弹：<span class="f">fs</span>₁ = ½<span class="f">m</span>(<span class="f">v</span>₀²−<span class="f">v</span>²)，<span class="v">s₁ = ${fx(s1,4)} m</span>；木块：<span class="f">fs</span>₂ = ½<span class="f">Mv</span>²，<span class="v">s₂ = ${fx(s2,4)} m</span><br>打入深度 <span class="f">d</span> = <span class="f">s</span>₁−<span class="f">s</span>₂ = <span class="f">mMv</span>₀² / [2<span class="f">f</span>(<span class="f">m</span>+<span class="f">M</span>)]，<span class="v">d = ${fx(d,4)} m</span>`)+
st(4,`不射出需木块长 <span class="v">L ≥ ${fx(d,4)} m</span>。损失的机械能 <span class="f">Q</span> = <span class="f">fd</span> = <span class="v">${fx(Q,1)} J</span>，占初动能 ${fx(Q/E0*100,1)}%`);
const nt=$("note"),txt=kind==="bad"?`当前木块长 ${L} m 小于 d，子弹会射穿木块，上面 (1)～(4) 的共速结论不再成立。`:`当前木块长 ${L} m ≥ d，子弹留在木块内，与木块共速。`;
if(nt.textContent!==txt)nt.textContent=txt;
if(noteKind!==kind){nt.className="note "+kind;if(noteKind!==null){void nt.offsetWidth;nt.classList.add("swap");}noteKind=kind;}}
function reset(){twA.kick();twL.kick();read();solve();K=620/Math.max(P.L+S.s2*1.4+0.12,0.45);st={xb:-110/K,vb:P.v0,xk:0,vk:0,t:0,inside:false,out:false,pen:0,trail:[]};run=false;$("play").textContent="▶ 播放";}
function step(dt){const{m,M,f,L}=P,n=300,h=dt/n;
for(let i=0;i<n;i++){const front=st.xk,back=st.xk+L,inB=st.xb>=front&&st.xb<=back&&!st.out;
if(inB&&st.vb>st.vk+1e-9){st.inside=true;st.vb-=f/m*h;st.vk+=f/M*h;if(st.vb<st.vk){const v=(m*st.vb+M*st.vk)/(m+M);st.vb=st.vk=v;}}
else if(inB&&st.inside)st.vb=st.vk;
st.xb+=st.vb*h;st.xk+=st.vk*h;st.t+=h;if(st.inside&&st.xb>back)st.out=true;if(st.inside&&!st.out)st.pen=st.xb-front;}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ===== 放大镜区域 =====
function niceR(v){const c=[0.5,1,2,3,5,8,10,15,20,30,50,80,100,150,200,300,500];for(const x of c)if(x>=v)return x;return Math.ceil(v/100)*100;}
function drawInset(){const top=300,bot=CH-16,L0=40,R0=640;
ctx.fillStyle="#F6F3EC";rr(24,top-8,CW-48,bot-top+16,14);ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();
const Rmm=niceR(Math.max(S.s2*1000*1.35,0.3)),ppm=(R0-L0-60)/Rmm,sx0=L0+30,gyI=bot-34;
ctx.fillStyle=C.muted;ctx.font="12px -apple-system,PingFang SC,sans-serif";ctx.fillText("放大镜 · 起点附近（约 ×"+(ppm/(K/1000)).toFixed(0)+"）",L0,top+14);
ctx.save();ctx.beginPath();ctx.rect(L0,top+22,R0-L0,bot-top-22);ctx.clip();
// 木块左端
const ex=sx0+st.xk*1000*ppm,bt=top+44;
const g=ctx.createLinearGradient(0,bt,0,gyI);g.addColorStop(0,"#C99B6E");g.addColorStop(1,"#A87A50");ctx.fillStyle=g;rr(ex,bt,R0-ex+20,gyI-bt,6);ctx.fill();
ctx.strokeStyle="rgba(255,255,255,.14)";for(let y=bt+10;y<gyI;y+=11){ctx.beginPath();ctx.moveTo(ex,y);ctx.lineTo(R0+20,y+2);ctx.stroke();}
// 弹孔入口
if(st.inside){ctx.fillStyle="rgba(60,35,15,.55)";ctx.fillRect(ex,(bt+gyI)/2-3,R0-ex+20,6);}
ctx.restore();
// 地面+刻度
ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(L0,gyI);ctx.lineTo(R0,gyI);ctx.stroke();
const stepMM=Rmm<=1?0.1:Rmm<=3?0.5:Rmm<=10?1:Rmm<=30?5:10;ctx.lineWidth=1;ctx.fillStyle=C.muted;ctx.textAlign="center";ctx.font="11px Georgia,serif";
for(let v=0,i=0;v<=Rmm+1e-9;v+=stepMM,i++){const x=sx0+v*ppm,big=i%5===0||stepMM>=1&&i%1===0&&Rmm<=10;ctx.strokeStyle=C.muted;ctx.beginPath();ctx.moveTo(x,gyI);ctx.lineTo(x,gyI+(big?9:5));ctx.stroke();if(big)ctx.fillText(+v.toFixed(2)+"",x,gyI+21);}
ctx.textAlign="left";ctx.fillText("mm",R0-24,gyI+21);
// 起点线
ctx.setLineDash([4,4]);ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(sx0,top+30);ctx.lineTo(sx0,gyI);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle=C.ink;ctx.font="11px -apple-system,PingFang SC,sans-serif";ctx.fillText("起点",sx0-12,top+32);
// s2 箭头
if(st.xk>0){const ay=top+36;ctx.strokeStyle=C.clay;ctx.fillStyle=C.clay;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx0,ay);ctx.lineTo(ex,ay);ctx.stroke();if(ex-sx0>8){ctx.beginPath();ctx.moveTo(ex,ay);ctx.lineTo(ex-8,ay-5);ctx.lineTo(ex-8,ay+5);ctx.fill();}}
// 右侧大读数
const rx=R0+40;ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(R0+16,top+10);ctx.lineTo(R0+16,bot-10);ctx.stroke();
ctx.fillStyle=C.muted;ctx.font="13px -apple-system,PingFang SC,sans-serif";ctx.fillText("木块位移 s₂",rx,top+28);ctx.fillText("打入深度 d（子弹相对木块）",rx,top+102);
ctx.fillStyle=C.clay;ctx.font="600 38px Georgia,serif";ctx.fillText(fx(st.xk*1000,2)+" mm",rx,top+72);
ctx.fillStyle=C.ink;ctx.fillText(fx(Math.min(st.pen,P.L)*1000,1)+" mm",rx,top+146);
}
function draw(){ctx.clearRect(0,0,CW,CH);const x0=230,gy=250,bh=92;
// 地面
ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(40,gy);ctx.lineTo(CW-40,gy);ctx.stroke();
ctx.strokeStyle="#ECE9DF";ctx.lineWidth=1;for(let x=50;x<CW-40;x+=14){ctx.beginPath();ctx.moveTo(x,gy+1);ctx.lineTo(x-8,gy+9);ctx.stroke();}
ctx.fillStyle=C.muted;ctx.font="12px -apple-system,PingFang SC,sans-serif";ctx.fillText("光滑水平面",44,gy+26);
// 起点参考线
ctx.setLineDash([3,4]);ctx.strokeStyle="#D6D2C5";ctx.beginPath();ctx.moveTo(x0,gy-bh-30);ctx.lineTo(x0,gy);ctx.stroke();ctx.setLineDash([]);
// 木块
const bx=x0+st.xk*K,bw=Math.max(P.L*K,10),by=gy-bh;
ctx.save();ctx.shadowColor="rgba(80,60,30,.18)";ctx.shadowBlur=14;ctx.shadowOffsetY=6;rr(bx,by,bw,bh,6);
const g=ctx.createLinearGradient(0,by,0,gy);g.addColorStop(0,"#C99B6E");g.addColorStop(1,"#A87A50");ctx.fillStyle=g;ctx.fill();ctx.restore();
ctx.save();rr(bx,by,bw,bh,6);ctx.clip();ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;for(let y=by+10;y<gy;y+=11){ctx.beginPath();ctx.moveTo(bx,y);ctx.bezierCurveTo(bx+bw*.3,y-3,bx+bw*.7,y+3,bx+bw,y);ctx.stroke();}
const hy=by+bh/2;if(st.inside){ctx.fillStyle="rgba(60,35,15,.55)";ctx.fillRect(bx,hy-2.5,Math.min(st.pen,P.L)*K,5);}ctx.restore();
ctx.fillStyle="rgba(255,255,255,.92)";ctx.font="600 15px Georgia,serif";ctx.textAlign="center";ctx.fillText("M",bx+bw/2,by+22);ctx.textAlign="left";
// 子弹（拖尾）
const px=x0+st.xb*K;st.trail.push(px);if(st.trail.length>14)st.trail.shift();
if(!(st.inside&&!st.out&&st.vb<=st.vk+1e-6)||st.out){const tl=st.trail[0];const gr=ctx.createLinearGradient(tl,0,px,0);gr.addColorStop(0,"rgba(201,100,66,0)");gr.addColorStop(1,"rgba(201,100,66,.35)");ctx.fillStyle=gr;ctx.fillRect(tl,hy-2,px-tl-12,4);}
ctx.fillStyle=C.brass;ctx.beginPath();ctx.moveTo(px+4,hy);ctx.quadraticCurveTo(px-2,hy-5,px-10,hy-5);ctx.lineTo(px-20,hy-5);ctx.lineTo(px-20,hy+5);ctx.lineTo(px-10,hy+5);ctx.quadraticCurveTo(px-2,hy+5,px+4,hy);ctx.fill();
ctx.fillStyle="#A8842F";ctx.fillRect(px-20,hy-5,3,10);
// 位移标注
const ay=gy-bh-22;ctx.strokeStyle=C.clay;ctx.fillStyle=C.clay;ctx.lineWidth=1.5;
if(st.xk*K>2){ctx.beginPath();ctx.moveTo(x0,ay);ctx.lineTo(bx,ay);ctx.stroke();ctx.beginPath();ctx.moveTo(bx,ay);ctx.lineTo(bx-6,ay-4);ctx.lineTo(bx-6,ay+4);ctx.fill();}
ctx.font="12.5px -apple-system,PingFang SC,sans-serif";ctx.fillText("木块位移 s₂ = "+fx(st.xk,4)+" m",x0+4,ay-8);
drawInset();
// 左上角仪表
ctx.fillStyle=C.muted;ctx.font="12px -apple-system,PingFang SC,sans-serif";ctx.fillText("时间",44,40);
ctx.fillStyle=C.ink;ctx.font="600 20px Georgia,serif";ctx.fillText(fx(st.t*1000)+" ms",44,64);
const bars=[["子弹速度",st.vb,C.brass],["木块速度",st.vk,C.wood2]];
bars.forEach((b,i)=>{const y=40+i*30,x=640;ctx.fillStyle=C.muted;ctx.font="12px -apple-system,PingFang SC,sans-serif";ctx.fillText(b[0],x,y+4);
ctx.fillStyle="#EFECE3";rr(x+64,y-4,230,8,4);ctx.fill();ctx.fillStyle=b[2];rr(x+64,y-4,Math.max(4,b[1]/P.v0*230),8,4);ctx.fill();
ctx.fillStyle=C.ink;ctx.font="600 13px Georgia,serif";ctx.fillText(fx(b[1],2)+" m/s",x+304,y+5);});
// 状态
let s=!st.inside?"子弹飞向木块":st.out?"子弹已射穿木块":st.vb>st.vk+1e-6?"子弹在木块中减速，木块加速":"共速，一起匀速运动";
ctx.fillStyle=C.clay;ctx.font="600 13px -apple-system,PingFang SC,sans-serif";ctx.fillText("● "+s,44,92);
// 实时
const{m,M}=P,T=(k,x)=>twL.v(k,x),p=T('p',m*st.vb+M*st.vk),Ek0=.5*m*st.vb*st.vb+.5*M*st.vk*st.vk,Ek=T('Ek',Ek0),Q=T('Q',S.E0-Ek0),p0=T('p0',m*P.v0),pen=T('pen',Math.min(st.pen,P.L));
const kb=T('kb',.5*m*st.vb*st.vb/S.E0*100),kk=T('kk',.5*M*st.vk*st.vk/S.E0*100),kq=Math.max(0,100-kb-kk);
$("live").innerHTML=`<div class="r"><span>系统总动量</span><b>${fx(p,4)} kg·m/s</b></div>
<div class="r"><span>初始总动量</span><b>${fx(p0,4)} kg·m/s</b></div>
<div class="r"><span>系统总动能</span><b>${fx(Ek,2)} J</b></div>
<div class="r"><span>已转化为内能</span><b>${fx(Q,2)} J</b></div>
<div class="r"><span>打入深度</span><b>${fx(pen,4)} m${st.out?"（射穿）":""}</b></div>
<div style="margin-top:10px;font-size:12px;color:#7A776D">初动能去向</div>
<div class="meter"><i style="width:${kb}%;background:${C.brass}"></i><i style="width:${kk}%;background:${C.wood2}"></i><i style="width:${kq}%;background:${C.clay}"></i></div>
<div class="legend"><span style="--c:${C.brass}">子弹动能</span><span style="--c:${C.wood2}">木块动能</span><span style="--c:${C.clay}">内能 Q</span></div>`;}

// ===== Clawd 待机（沿用用户提供的造型与 idle 动作） =====
const smoothK=t=>t*t*(3-2*t);
function keyK(t,pts){for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*smoothK((t-a[0])/(b[0]-a[0]));}}return pts[pts.length-1][1];}
function clawdSVG(frame){const t=(frame%180)/180,y=4*(1-Math.cos(t*Math.PI*2))/2,bl=keyK(t,[[0,1],[.38,1],[.41,.12],[.43,.12],[.47,1],[1,1]]);
let s='<ellipse cx="60" cy="102" rx="40" ry="3" fill="#3D3929" opacity=".10"/>';
[31,51,69,89].forEach(x=>{s+='<rect x="'+(x-6)+'" y="'+(70+y)+'" width="12" height="'+Math.max(10,95-(70+y))+'" fill="#D77757"/>';});
s+='<g transform="translate(0 '+y+')"><rect x="0" y="30" width="20" height="20" fill="#D77757"/><rect x="100" y="30" width="20" height="20" fill="#D77757"/><rect x="20" y="10" width="80" height="60" fill="#D77757"/>';
s+='<rect x="38" y="'+(31-6*bl)+'" width="10" height="'+(12*bl)+'" fill="#171717"/><rect x="72" y="'+(31-6*bl)+'" width="10" height="'+(12*bl)+'" fill="#171717"/></g>';
return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -55 160 175" shape-rendering="crispEdges">'+s+'</svg>';}
let cf=0,cprev=null;
function clawdTick(now){if(cprev!==null)cf=(cf+Math.min(now-cprev,100)*60/1000)%180;cprev=now;$("clawd").innerHTML=clawdSVG(Math.floor(cf));requestAnimationFrame(clawdTick);}
function placeClawd(){const r=cv.getBoundingClientRect(),k=r.width/CW,el=$("clawd");const W0=120,H0=W0*175/160;el.style.width=W0*k+"px";el.style.height=H0*k+"px";
// 脚底(viewBox y=95)对齐讲解栏底线
el.style.top=(118*k-(95+55)/175*H0*k)+"px";el.style.left=((CW/2-W0/2)*k)+"px";}
window.addEventListener("resize",placeClawd);
function frame(t){if(lastT==null)lastT=t;const dt=Math.min((t-lastT)/1000,.05);lastT=t;
if(run){const contact=st.inside&&!st.out&&st.vb>st.vk+1e-6;
const ts=contact?S.t/(slow?2.4:0.6):(110/K)/P.v0/(slow?0.9:0.3);
if(!st.inside||contact||st.out)step(dt*ts);else step(dt*(slow?110:260)/(K*Math.max(st.vk,1e-3)));
if(x0px()>CW-60||230+st.xb*K>CW+30){run=false;$("play").textContent="↺ 重放";}}
draw();if(twA.active()||twA.dirty){renderAns();twA.dirty=twA.active();}requestAnimationFrame(frame);}
function x0px(){return 230+(st.xk+P.L)*K;}
defs.forEach(d=>$(d[0]).oninput=reset);
$("play").onclick=()=>{if(!run&&st.t>0)reset();run=!run;$("play").textContent=run?"❚❚ 暂停":"▶ 继续";};
$("slow").onclick=()=>{slow=!slow;$("slow").textContent="慢放 "+(slow?"开":"关");};
reset();placeClawd();
document.querySelectorAll('.box,.stage').forEach(el=>{const chk=()=>el.classList.toggle('scroll-fade',el.scrollHeight>el.clientHeight+1&&getComputedStyle(el).overflowY!=='visible');chk();window.addEventListener('resize',chk);});requestAnimationFrame(frame);requestAnimationFrame(clawdTick);
</script></body></html>
